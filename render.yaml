services:
  - type: web
    name: cosmetics-api
    runtime: docker
    dockerfilePath: ./deployment/Dockerfile
    dockerContext: .
    healthCheckPath: /api/__health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: ALLOWED_ORIGIN
        value: https://lera090807.github.io
